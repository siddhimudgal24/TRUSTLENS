<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title description">
  <title id="title">TRUSTLENS project architecture</title>
  <desc id="description">React and Vite frontend with local demonstration data and a development API proxy to a standalone Java HTTP server. The API uses authentication handlers, DAOs, MySQL, and javax.mail with SMTP. A separate Java Servlet and JSP application is packaged as a WAR by Maven.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#52627a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #536176; }
      .section { font-size: 17px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 650; }
      .small { font-size: 12px; fill: #536176; }
      .tiny { font-size: 11px; fill: #536176; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .browser-panel { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; }
      .api-panel { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.5; }
      .war-panel { fill: #faf5ff; stroke: #d8b4fe; stroke-width: 1.5; }
      .node { fill: #fff; stroke: #cbd5e1; stroke-width: 1.2; }
      .blue-node { fill: #dbeafe; stroke: #93c5fd; }
      .green-node { fill: #dcfce7; stroke: #86efac; }
      .purple-node { fill: #f3e8ff; stroke: #d8b4fe; }
      .edge { fill: none; stroke: #52627a; stroke-width: 2; marker-end: url(#arrow); }
      .blue-edge { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrow-blue); }
      .dashed { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1200" height="740" rx="18" fill="#fff"/>
  <text class="title" x="40" y="48">TRUSTLENS | Project Architecture</text>
  <text class="subtitle" x="40" y="73">Frontend demonstrations and authentication services, with a separate Servlet/JSP WAR deployment path</text>

  <rect class="browser-panel" x="35" y="105" width="440" height="485" rx="14"/>
  <text class="section" x="58" y="138">Browser application</text>
  <text class="small" x="58" y="160">React 19 · TypeScript · Vite · React Router</text>

  <rect class="node blue-node" x="65" y="185" width="380" height="75" rx="10"/>
  <text class="label" x="85" y="213">Application screens</text>
  <text class="small" x="85" y="237">Dashboard · shelters · map · authentication · analytics</text>

  <rect class="node" x="65" y="290" width="180" height="90" rx="10"/>
  <text class="label" x="83" y="320">Zustand</text>
  <text class="small" x="83" y="343">In-memory UI state</text>
  <text class="tiny" x="83" y="361">selection and local updates</text>

  <rect class="node" x="265" y="290" width="180" height="90" rx="10"/>
  <text class="label" x="283" y="320">Sample fixtures</text>
  <text class="small" x="283" y="343">Shelters · zones · roads</text>
  <text class="tiny" x="283" y="361">scenarios and map layers</text>

  <path class="edge" d="M245 335 H255"/>
  <path class="edge" d="M155 290 V270"/>
  <path class="edge" d="M355 290 V270"/>

  <rect class="node blue-node" x="65" y="410" width="380" height="95" rx="10"/>
  <text class="label" x="85" y="440">Vite development server · port 5173</text>
  <text class="small" x="85" y="464">Serves the frontend and proxies /api in development</text>
  <text class="tiny" x="85" y="485">Proxy target: http://localhost:8080</text>
  <path class="edge" d="M255 410 V390"/>

  <rect class="api-panel" x="510" y="105" width="390" height="300" rx="14"/>
  <text class="section" x="533" y="138">Standalone Java API · port 8080</text>
  <text class="small" x="533" y="160">JDK com.sun.net.httpserver.HttpServer</text>

  <rect class="node green-node" x="540" y="185" width="330" height="70" rx="10"/>
  <text class="label" x="560" y="213">Authentication and OTP handlers</text>
  <text class="small" x="560" y="237">Login · registration · verify/send OTP · password reset</text>

  <rect class="node" x="540" y="285" width="145" height="75" rx="10"/>
  <text class="label" x="560" y="315">DAO layer</text>
  <text class="small" x="560" y="339">UserDAO · OtpDAO</text>

  <rect class="node" x="710" y="285" width="160" height="75" rx="10"/>
  <text class="label" x="730" y="315">javax.mail</text>
  <text class="small" x="730" y="339">OTP email delivery</text>

  <path class="edge" d="M705 255 V273 H612 V278"/>
  <path class="edge" d="M705 255 V273 H790 V278"/>
  <path class="blue-edge" d="M475 458 H492 V220 H532"/>
  <rect x="477" y="421" width="103" height="25" rx="5" fill="#fff"/>
  <text class="tiny" x="484" y="438">/api requests</text>

  <rect class="panel" x="945" y="105" width="220" height="300" rx="14"/>
  <text class="section" x="968" y="138">External services</text>
  <rect class="node" x="970" y="190" width="170" height="70" rx="10"/>
  <text class="label" x="990" y="220">MySQL</text>
  <text class="small" x="990" y="242">trustlens_db schema</text>
  <rect class="node" x="970" y="300" width="170" height="65" rx="10"/>
  <text class="label" x="990" y="328">SMTP provider</text>
  <text class="small" x="990" y="349">configured mail server</text>
  <path class="edge" d="M685 322 H925 V225 H962"/>
  <path class="edge" d="M870 322 H920 V332 H962"/>

  <rect class="war-panel" x="510" y="455" width="655" height="135" rx="14"/>
  <text class="section" x="533" y="488">Separate Servlet/JSP web application</text>
  <text class="small" x="533" y="512">Java Servlets · JSP/JSTL · web.xml · javax.servlet API</text>
  <rect class="node purple-node" x="535" y="530" width="270" height="42" rx="8"/>
  <text class="label" x="555" y="557">Servlets → JSP views</text>
  <rect class="node purple-node" x="830" y="530" width="300" height="42" rx="8"/>
  <text class="label" x="850" y="557">Apache Maven → trustlens.war</text>
  <rect x="35" y="620" width="1130" height="78" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/>
  <text class="label" x="58" y="650">Important runtime distinction</text>
  <text class="small" x="58" y="674">ServerRunner uses the JDK HTTP server; it does not run the Servlet/JSP WAR. Maven packaging builds the separate WAR for a compatible servlet container.</text>
</svg>
